<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm {{ action|default:'Delete' }} - FarmShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { background: #1a472a; min-height: 100vh; }
        .nav-link { color: #d4e6d9; }
        .nav-link:hover, .nav-link.active { background: #2d5a3a; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center"><h4 class="text-success">FarmShield</h4></div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/">Dashboard</a>
                    <a class="nav-link" href="/farms/">Farms</a>
                    <a class="nav-link" href="/sensors/">Sensors</a>
                    <a class="nav-link" href="/disease/">Disease Risk</a>
                    <a class="nav-link" href="/irrigation/">Irrigation</a>
                    <a class="nav-link" href="/yield/">Yield Forecast</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h2 class="text-danger">Confirm {{ action|default:'Delete' }}</h2>
                <div class="card p-4">
                    <p>Are you sure you want to {{ action|default:'delete' }} this <strong>{{ type }}: {{ item }}</strong>?</p>
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">{{ action|default:'Delete' }}</button>
                        <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
