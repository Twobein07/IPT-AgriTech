<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} Farm - FarmShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { background: #1a472a; min-height: 100vh; }
        .nav-link { color: #d4e6d9; }
        .nav-link:hover, .nav-link.active { background: #2d5a3a; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center"><h4 class="text-success">FarmShield</h4></div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/">Dashboard</a>
                    <a class="nav-link" href="/farms/">Farms</a>
                    <a class="nav-link" href="/sensors/">Sensors</a>
                    <a class="nav-link" href="/disease/">Disease Risk</a>
                    <a class="nav-link" href="/irrigation/">Irrigation</a>
                    <a class="nav-link" href="/yield/">Yield Forecast</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h2 class="text-success">{{ action }} Farm</h2>
                <form method="POST" class="card p-4">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Farm Name</label>
                        <input type="text" name="name" class="form-control" value="{{ farm.name|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Owner</label>
                        <input type="text" name="owner" class="form-control" value="{{ farm.owner|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" value="{{ farm.location|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Crop Type</label>
                        <select name="crop_type" class="form-select" required>
                            {% for value, label in crops %}
                            <option value="{{ value }}" {% if farm.crop_type == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Area (Hectares)</label>
                        <input type="number" name="area_hectares" class="form-control" value="{{ farm.area_hectares|default:'1' }}" step="0.1" required>
                    </div>
                    <button type="submit" class="btn btn-success">Save</button>
                    <a href="/farms/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
