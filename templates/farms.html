<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farms - FarmShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar { background: #1a472a; min-height: 100vh; }
        .nav-link { color: #d4e6d9; }
        .nav-link:hover, .nav-link.active { background: #2d5a3a; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center"><h4 class="text-success">FarmShield</h4></div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/">Dashboard</a>
                    <a class="nav-link active" href="/farms/">Farms</a>
                    <a class="nav-link" href="/sensors/">Sensors</a>
                    <a class="nav-link" href="/disease/">Disease Risk</a>
                    <a class="nav-link" href="/irrigation/">Irrigation</a>
                    <a class="nav-link" href="/yield/">Yield Forecast</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-success mb-0"><i class="bi bi-tree"></i> My Farms</h2>
                    <a href="/farms/create/" class="btn btn-success"><i class="bi bi-plus-circle"></i> Add Farm</a>
                </div>
                <div class="row">
                    {% for farm in farms %}
                    <div class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-header bg-success text-white d-flex justify-content-between">
                                <span>{{ farm.name }}</span>
                                <span>{{ farm.get_crop_type_display }}</span>
                            </div>
                            <div class="card-body">
                                <p><i class="bi bi-person"></i> {{ farm.owner }}</p>
                                <p><i class="bi bi-geo-alt"></i> {{ farm.location }}</p>
                                <p><i class="bi bi-arrows-angle-expand"></i> {{ farm.area_hectares }} hectares</p>
                                <div class="mt-2">
                                    <a href="/farms/edit/{{ farm.id }}/" class="btn btn-sm btn-outline-primary">Edit</a>
                                    <a href="/farms/delete/{{ farm.id }}/" class="btn btn-sm btn-outline-danger">Delete</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
