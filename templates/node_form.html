<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ action }} Sensor Node - FarmShield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { background: #1a472a; min-height: 100vh; }
        .nav-link { color: #d4e6d9; }
        .nav-link:hover, .nav-link.active { background: #2d5a3a; color: #fff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center"><h4 class="text-success">FarmShield</h4></div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="/">Dashboard</a>
                    <a class="nav-link" href="/farms/">Farms</a>
                    <a class="nav-link" href="/sensors/">Sensors</a>
                    <a class="nav-link" href="/disease/">Disease Risk</a>
                    <a class="nav-link" href="/irrigation/">Irrigation</a>
                    <a class="nav-link" href="/yield/">Yield Forecast</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h2 class="text-success">{{ action }} Sensor Node</h2>
                <form method="POST" class="card p-4">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Node ID</label>
                        <input type="text" name="node_id" class="form-control" placeholder="FS-XXX-XXX" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Farm</label>
                        <select name="farm" class="form-select" required>
                            {% for farm in farms %}
                            <option value="{{ farm.id }}">{{ farm.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Latitude</label>
                        <input type="number" name="latitude" class="form-control" step="0.000001" value="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Longitude</label>
                        <input type="number" name="longitude" class="form-control" step="0.000001" value="0">
                    </div>
                    <button type="submit" class="btn btn-success">Save</button>
                    <a href="/sensors/" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
